# Builds the universal app on GitHub's Macs. Push a tag like v1.0.0 to publish a release.
#
# Signing and notarization turn on by themselves once these repository secrets exist
# (Settings > Secrets and variables > Actions). Without them the release is unsigned.
#   MACOS_CERTIFICATE           your "Developer ID Application" certificate (.p12), base64-encoded
#   MACOS_CERTIFICATE_PASSWORD  the password you chose when exporting the .p12
#   APPLE_ID                    the Apple ID email of your developer account
#   APPLE_TEAM_ID               your 10-character Team ID
#   APPLE_APP_PASSWORD          an app-specific password from account.apple.com
name: Build Leeway

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macOS 15 runners still build for Intel Macs. GitHub plans to retire them in fall 2027.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Load the signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$MACOS_CERTIFICATE" ]]; then
            echo "No MACOS_CERTIFICATE secret, so this release will be unsigned."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/certificate.p12"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -o '"Developer ID Application: [^"]*"' | head -n 1 | tr -d '"')"
          if [[ -z "$IDENTITY" ]]; then
            echo "The certificate isn't a Developer ID Application certificate."
            exit 1
          fi
          echo "Signing as: $IDENTITY"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build universal app
        env:
          REQUIRE_UNIVERSAL: "1"
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          else
            export VERSION="0.0.0-dev"
          fi
          bash build.sh

      - name: Check the signature
        if: env.SIGN_IDENTITY != ''
        run: |
          codesign --verify --deep --strict --verbose=2 build/Leeway.app
          spctl --assess --type execute --verbose=2 build/Leeway.app || \
            echo "Gatekeeper check failed. Is notarization set up (APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD)?"

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: Leeway
          path: build/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.zip
