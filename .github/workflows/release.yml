# Builds the universal app on GitHub's Macs. Push a tag like v1.0.0 to publish a release.
name: Build Leeway

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macOS 15 runners still build for Intel Macs. GitHub plans to retire them in fall 2027.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app
        env:
          REQUIRE_UNIVERSAL: "1"
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          else
            export VERSION="0.0.0-dev"
          fi
          bash build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Leeway
          path: build/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.zip
